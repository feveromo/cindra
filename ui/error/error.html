<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cindra Summary Error</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="error.css">
</head>
<body class="error-body">
  <main class="error-card" role="alert" aria-labelledby="error-title" aria-describedby="error-message">
    <div class="error-card__mark" aria-hidden="true"><img src="/images/icon48.png" alt=""></div>
    <span class="eyebrow">Handoff interrupted</span>
    <h1 id="error-title">Cindra couldn’t finish</h1>
    <p id="error-message">Cindra could not complete that request.</p>
    <div class="error-card__foot">
      <span>Press Esc to close</span>
      <button id="close-button" class="primary-btn" type="button">Close Tab</button>
    </div>
  </main>
  <script src="../../lib/errors.js"></script>
  <script src="error.js"></script>
</body>
</html>

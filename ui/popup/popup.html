<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cindra Summary</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
  <main class="popup" aria-labelledby="page-title">
    <header class="masthead">
      <div class="brand">
        <img src="/images/icon48.png" alt="" class="brand__mark">
        <h1 id="page-title" class="wordmark">Cindra</h1>
        <span class="version-pill" id="version-pill" aria-label="Extension version"></span>
      </div>
      <button id="options-btn" class="icon-button" type="button" aria-label="Open settings" title="Settings">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h8M15 6h2M3 14h2M9 14h8"/>
          <circle cx="13" cy="6" r="2"/>
          <circle cx="7" cy="14" r="2"/>
        </svg>
      </button>
    </header>

    <section class="route" aria-label="Handoff route">
      <div class="route__step">
        <label for="content-source" class="route__word"><span aria-hidden="true">Send</span><span class="sr-only">Content source</span></label>
        <div class="select-wrap"><select id="content-source"></select></div>
      </div>
      <div class="route__step">
        <label for="ai-model" class="route__word"><span aria-hidden="true">to</span><span class="sr-only">AI model</span></label>
        <div class="select-wrap"><select id="ai-model"></select></div>
      </div>
      <div class="route__step">
        <label for="prompt-selector" class="route__word"><span aria-hidden="true">using</span><span class="sr-only">Prompt preset</span></label>
        <div class="select-wrap"><select id="prompt-selector"></select></div>
      </div>
    </section>

    <section class="draft">
      <div class="draft__head">
        <label for="summary-prompt" class="field-label">Prompt draft</label>
        <span class="draft__note">Changes apply to this send only</span>
      </div>
      <textarea id="summary-prompt" rows="4" maxlength="20000" placeholder="Tell the AI what to do with this page…"></textarea>
    </section>

    <button id="summarize-btn" class="primary-btn send-btn" type="button">Summarize Current Page</button>

    <section id="handoff-status" class="status-line is-idle" aria-labelledby="handoff-heading" aria-live="polite" aria-atomic="true">
      <span class="status-dot" aria-hidden="true"></span>
      <p class="status-line__text">
        <span id="handoff-heading" class="sr-only">Last handoff:</span>
        <span id="handoff-status-text">Ready.</span>
      </p>
      <div id="handoff-actions" class="handoff-actions" hidden>
        <button id="copy-last-prompt" class="text-btn" type="button">Copy</button>
        <button id="resend-last-prompt" class="text-btn" type="button">Resend</button>
        <button id="clear-handoff-history" class="text-btn" type="button">Clear</button>
      </div>
    </section>

    <footer class="popup-foot">
      <span>Or press</span>
      <span class="shortcut-hint" aria-label="Control X X">
        <kbd>Ctrl</kbd><kbd>X</kbd><kbd>X</kbd>
      </span>
      <span>on a supported page</span>
    </footer>
  </main>
  <script src="../../lib/errors.js"></script>
  <script src="../../lib/chrome.js"></script>
  <script src="../../lib/messages.js"></script>
  <script src="../../lib/prompt.js"></script>
  <script src="../../lib/providers.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cindra Summary Error</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="error.css">
</head>
<body class="error-body">
  <main class="error-shell" aria-labelledby="error-title">
    <section class="error-card" role="alert" aria-describedby="error-message">
      <div class="error-card__mark" aria-hidden="true">!</div>
      <div class="error-card__copy">
        <span class="eyebrow">Handoff interrupted</span>
        <h1 id="error-title">Cindra could not finish</h1>
        <p id="error-message">Cindra could not complete that request.</p>
      </div>
      <button id="close-button" class="primary-btn" type="button">Close Tab</button>
    </section>
  </main>
  <script src="../../lib/errors.js"></script>
  <script src="error.js"></script>
</body>
</html>
